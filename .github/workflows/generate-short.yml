name: Motivational Shorts Factory

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  create-short-plan:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install requests


      - name: Create Factory Engine
        run: |

          cat > factory.py <<'PY'

import os
import json
import re
import time
import requests
from pathlib import Path


OUTPUT = Path("output")
OUTPUT.mkdir(exist_ok=True)



# =====================================
# CLOUDFLARE AI
# =====================================

def cloudflare_generate():

    account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
    token = os.environ["CLOUDFLARE_API_TOKEN"]


    url = (
        f"https://api.cloudflare.com/client/v4/accounts/"
        f"{account_id}/ai/run/@cf/meta/llama-3.1-8b-instruct"
    )


    payload = {

        "messages": [

            {
                "role": "system",
                "content": """
You are a professional motivational Shorts writer.

Create original motivational videos.

Rules:
- 30-60 seconds
- Strong hook
- Emotional progression
- Story based
- No copied quotes
- Every scene must match narration
- Return JSON only
"""
            },

            {
                "role": "user",
                "content": """
Create one motivational Short about discipline.

Return:

{
"title":"",
"theme":"",
"hook":"",
"narration":"",
"scenes":[
{
"scene":1,
"voice_line":"",
"visual_description":"",
"pexels_query":"",
"caption":""
}
]
}

Create exactly 6 scenes.
"""
            }

        ],

        "max_tokens":2500

    }



    response = requests.post(

        url,

        headers={
            "Authorization": f"Bearer {token}",
            "Content-Type":"application/json"
        },

        json=payload,

        timeout=120

    )


    response.raise_for_status()


    data = response.json()



    result = data.get("result")


    if result is None:
        raise Exception(data)



    # Handle different Cloudflare response formats

    if isinstance(result, dict):

        if "response" in result:

            return result["response"]


        return result



    return result




# =====================================
# JSON HANDLER
# =====================================

def extract_json(data):


    # Already JSON

    if isinstance(data, dict):
        return data



    # Convert string

    text = str(data)



    text = text.replace(
        "```json",
        ""
    )


    text = text.replace(
        "```",
        ""
    )



    match = re.search(
        r"\{.*\}",
        text,
        re.DOTALL
    )


    if not match:

        raise Exception(
            "No JSON found"
        )


    return json.loads(
        match.group()
    )




# =====================================
# VALIDATION
# =====================================

def validate(data):


    required = [

        "title",
        "theme",
        "hook",
        "narration",
        "scenes"

    ]


    for item in required:

        if item not in data:

            return False



    scenes = data["scenes"]


    if not isinstance(
        scenes,
        list
    ):

        return False



    if len(scenes) != 6:

        return False



    for scene in scenes:


        fields = [

            "voice_line",
            "visual_description",
            "pexels_query",
            "caption"

        ]



        for field in fields:

            if field not in scene:

                return False



    return True




# =====================================
# PEXELS
# =====================================

def search_pexels(query):


    key = os.environ["PEXELS_API_KEY"]


    response = requests.get(

        "https://api.pexels.com/videos/search",

        headers={
            "Authorization":key
        },

        params={

            "query":query,
            "per_page":3

        },

        timeout=30

    )


    response.raise_for_status()


    data=response.json()



    videos=[]



    for video in data.get(
        "videos",
        []
    ):


        videos.append(

            {

            "id":video["id"],
            "url":video["url"]

            }

        )



    return videos





# =====================================
# MAIN PIPELINE
# =====================================


print(
"Starting Motivational Factory"
)



final=None



for attempt in range(3):


    try:

        print(
            "Attempt",
            attempt+1
        )



        generated = cloudflare_generate()



        plan = extract_json(
            generated
        )



        if validate(plan):

            final=plan

            break



        raise Exception(
            "Validation failed"
        )



    except Exception as e:


        print(
            "ERROR:",
            e
        )


        time.sleep(5)





if final is None:

    raise Exception(
        "Could not generate valid Short"
    )





with open(

    OUTPUT / "short_plan.json",

    "w",

    encoding="utf-8"

) as f:


    json.dump(

        final,

        f,

        indent=2,

        ensure_ascii=False

    )





assets=[]



for scene in final["scenes"]:


    assets.append(

        {

        "scene":scene["scene"],

        "query":scene["pexels_query"],

        "videos":search_pexels(

            scene["pexels_query"]

        )

        }

    )





with open(

    OUTPUT / "visual_assets.json",

    "w",

    encoding="utf-8"

) as f:


    json.dump(

        assets,

        f,

        indent=2

    )




print(
"FACTORY COMPLETE"
)


PY



      - name: Run Factory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          python factory.py



      - name: Upload Generated Files
        uses: actions/upload-artifact@v4

        with:

          name: motivational-short-assets

          path: output/
