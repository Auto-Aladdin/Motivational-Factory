name: Motivational Shorts Factory

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  generate-short:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Python dependencies
      run: |
        pip install requests


    - name: Run AI Content Factory

      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      run: |

        cat > factory.py <<'PY'

import os
import json
import re
import requests
from pathlib import Path
from time import sleep


OUTPUT = Path("output")
OUTPUT.mkdir(exist_ok=True)


# ==============================
# CLOUDFLARE AI GENERATION
# ==============================


def call_ai():

    account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
    token = os.environ["CLOUDFLARE_API_TOKEN"]


    url = (
        f"https://api.cloudflare.com/client/v4/accounts/"
        f"{account}/ai/run/@cf/meta/llama-3.1-8b-instruct"
    )


    prompt = {

        "messages":[

            {
            "role":"system",
            "content":
"""
You create professional motivational Shorts.

Rules:
- Write original content.
- No famous quotes.
- 35-55 seconds.
- Story driven.
- Emotional progression.
- Visuals must match narration.

Return ONLY JSON.
"""
            },


            {
            "role":"user",
            "content":
"""
Create one motivational short about discipline.

Return exactly:

{
"title":"",
"hook":"",
"narration":"",
"scenes":[
{
"voice_line":"",
"visual":"",
"pexels":"",
"caption":""
}
]
}

Create exactly 6 scenes.

Keep every field short.
"""
            }

        ],

        "max_tokens":1800

    }


    response=requests.post(

        url,

        headers={
        "Authorization":f"Bearer {token}",
        "Content-Type":"application/json"
        },

        json=prompt,

        timeout=120

    )


    response.raise_for_status()


    data=response.json()


    return data["result"]["response"]



# ==============================
# CLEAN JSON
# ==============================


def extract_json(text):

    match=re.search(
        r'\{.*\}',
        text,
        re.DOTALL
    )


    if not match:
        raise Exception(
            "No JSON found"
        )


    return json.loads(
        match.group()
    )



# ==============================
# VALIDATION
# ==============================


def validate(data):


    required=[
        "title",
        "hook",
        "narration",
        "scenes"
    ]


    for item in required:

        if item not in data:
            return False


    if len(data["scenes"]) < 6:
        return False


    for scene in data["scenes"]:

        fields=[
            "voice_line",
            "visual",
            "pexels",
            "caption"
        ]

        for f in fields:

            if f not in scene:
                return False


    return True



# ==============================
# GENERATION LOOP
# ==============================


print("Starting Motivational Factory")


for attempt in range(3):


    try:

        print(
        f"Generation attempt {attempt+1}"
        )


        raw=call_ai()


        data=extract_json(raw)


        if validate(data):

            break


        raise Exception(
        "Validation failed"
        )


    except Exception as e:

        print(e)

        sleep(3)


else:

    raise Exception(
    "Failed after retries"
    )



# ==============================
# SAVE RESULT
# ==============================


file=OUTPUT/"short_plan.json"


file.write_text(

    json.dumps(
        data,
        indent=2,
        ensure_ascii=False
    ),

    encoding="utf-8"

)


print(
"SUCCESS"
)

print(
file
)


PY


        python factory.py



    - name: Upload result

      uses: actions/upload-artifact@v4

      with:

        name: motivational-short-plan

        path: output/short_plan.json
