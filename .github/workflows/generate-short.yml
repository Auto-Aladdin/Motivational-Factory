name: Motivational Shorts Factory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  create-short-plan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install requests


      - name: Create Factory Script
        run: |
          cat > factory.py <<'PY'
          import os
          import json

          print("Motivational Factory started")

          print(
              "Cloudflare:",
              bool(os.environ.get("CLOUDFLARE_API_TOKEN"))
          )

          print(
              "Pexels:",
              bool(os.environ.get("PEXELS_API_KEY"))
          )

          with open("output_test.json","w") as f:
              json.dump(
                  {
                    "status":"working"
                  },
                  f,
                  indent=2
              )

          print("Complete")
          PY


      - name: Run Factory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          python factory.py


      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: factory-test
          path: output_test.json
