name: Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Pexels API
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "Testing Pexels..."
          curl -s \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/search?query=motivation&per_page=1" \
            | head -c 500

      - name: Test Cloudflare Authentication
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Testing Cloudflare..."
          curl -s \
            -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/tokens/verify" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json"
